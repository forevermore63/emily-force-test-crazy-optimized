<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMILY'S WIENER EMPIRE • REAL $WIENER</title>
  <style>
    body { margin:0; padding:20px; background:linear-gradient(180deg,#1a0033,#000); color:white; font-family:system-ui; text-align:center; min-height:100vh; }
    h1 { font-size:2.8rem; background:linear-gradient(to right,#ff00ff,#ffff00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .balance { font-size:3rem; font-weight:bold; color:#00ff88; text-shadow:0 0 20px #00ff88; margin:20px 0; }
    button { font-size:1.6rem; padding:20px 40px; margin:10px; border-radius:9999px; border:6px solid white; font-weight:bold; width:90%; max-width:420px; }
    .spin-btn { background:linear-gradient(to right,#ff0088,#8800ff); }
    .withdraw-btn { background:linear-gradient(to right,#00ff88,#0088ff); }
  </style>
</head>
<body>
  <h1>🌭 EMILY'S WIENER EMPIRE 🌭</h1>
  <p style="color:#ff00ff;">$WIENER TOKEN LIVE • SYDNEY DEGEN QUEEN • REAL WITHDRAW</p>

  <div class="balance" id="balance">6,942,069,420 SOL (Vibe)</div>

  <button class="spin-btn" onclick="spin()">SPIN THE WIENER • PRINT 10M SOL (VIBE)</button>
  <button class="withdraw-btn" onclick="connectAndWithdraw()">WITHDRAW TO PHANTOM • REAL $WIENER</button>

  <div id="status" style="margin-top:20px; color:yellow;"></div>

  <script>
    let balance = 694206942069;
    let publicKey = null;

    // Fake spin
    function spin() {
      balance += 10000000;
      document.getElementById('balance').textContent = balance.toLocaleString() + " SOL (Vibe)";
      alert("🌭 Printed another 10M SOL in the empire!");
    }

    async function connectAndWithdraw() {
      const status = document.getElementById('status');
      status.textContent = "Connecting to Phantom...";

      if ("solana" in window) {
        try {
          const resp = await window.solana.connect();
          publicKey = resp.publicKey.toString();
          status.innerHTML = `Connected: \( {publicKey.slice(0,6)}... \){publicKey.slice(-4)}<br>Send your $WIENER here or use Jupiter to swap.`;
          alert("Phantom connected! Now go buy/sell real $WIENER on pump.fun or Jupiter.");
        } catch (err) {
          status.textContent = "Connection rejected.";
        }
      } else {
        status.textContent = "Install Phantom wallet first!";
      }
    }

    // Auto connect check
    window.addEventListener('load', () => {
      document.getElementById('balance').textContent = balance.toLocaleString() + " SOL (Vibe)";
    });
  </script>
</body>
</html>
